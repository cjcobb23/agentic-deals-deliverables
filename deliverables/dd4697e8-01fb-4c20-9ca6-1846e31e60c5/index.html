<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asteroids</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080d14; color: #e9f2f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    main { width: min(100%, 940px); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    h1 { font-size: 21px; font-weight: 600; letter-spacing: .18em; margin: 0; }
    button { font: inherit; color: #eef8fc; background: #182633; border: 1px solid #496071; border-radius: 6px; padding: 9px 19px; cursor: pointer; }
    button:hover { background: #263b4b; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid #a4e3e7; outline-offset: 4px; }
    canvas { display: block; width: 100%; height: auto; background: #0a111b; border: 1px solid #293c4b; border-radius: 8px; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; margin-top: 15px; color: #9aafbd; font-size: 14px; line-height: 1.5; }
    #status { color: #ffd4ca; min-height: 21px; }
  </style>
</head>
<body>
  <main>
    <header><h1>ASTEROIDS</h1><button id="restart" type="button">Restart</button></header>
    <canvas id="game" width="900" height="540" tabindex="0" aria-label="Asteroids play area. Arrow keys move the ship. Space fires."></canvas>
    <footer><span>Arrow keys move &nbsp;·&nbsp; Space fires</span><span id="status" role="status" aria-live="polite"></span></footer>
  </main>
  <script>
    'use strict';
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const W = canvas.width, H = canvas.height;
    const keys = new Set();
    const controls = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);
    let ship, asteroids, bullets, gameOver, fireCooldown;
    let lastFrame = performance.now();

    const random = (low, high) => low + Math.random() * (high - low);
    const wrap = (n, size) => (n % size + size) % size;
    function distance(a, b) {
      const dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
      return Math.hypot(Math.min(dx, W - dx), Math.min(dy, H - dy));
    }
    function asteroid(x, y, vx, vy) {
      return {
        x, y, vx, vy, r: random(26, 33), angle: random(0, Math.PI * 2),
        spin: random(-.35, .35),
        outline: Array.from({ length: 9 }, () => random(.84, 1))
      };
    }
    function restart() {
      keys.clear();
      ship = { x: W / 2, y: H / 2, angle: -Math.PI / 2, r: 11 };
      bullets = [];
      gameOver = false;
      fireCooldown = 0;
      status.textContent = '';
      asteroids = [
        asteroid(W / 2, random(35, 55), 0, random(24, 28)),
        asteroid(W - random(45, 65), H / 2, -random(21, 25), 0),
        asteroid(random(35, 75), random(35, 65), random(14, 21), random(10, 18)),
        asteroid(W - random(35, 75), random(35, 65), -random(14, 21), random(10, 18)),
        asteroid(random(35, 75), H - random(35, 65), random(14, 21), -random(10, 18)),
        asteroid(W - random(35, 75), H - random(35, 65), -random(14, 21), -random(10, 18))
      ];
      lastFrame = performance.now();
      canvas.focus({ preventScroll: true });
      draw();
    }
    function fire() {
      if (gameOver || fireCooldown > 0) return;
      bullets.push({
        x: wrap(ship.x + Math.cos(ship.angle) * 21, W),
        y: wrap(ship.y + Math.sin(ship.angle) * 21, H),
        vx: Math.cos(ship.angle) * 500,
        vy: Math.sin(ship.angle) * 500,
        remaining: 1.5
      });
      fireCooldown = .18;
    }
    function endGame() {
      gameOver = true;
      keys.clear();
      status.textContent = 'Game over. Select Restart to play again.';
    }
    document.addEventListener('keydown', event => {
      if (!controls.has(event.code)) return;
      event.preventDefault();
      if (gameOver) return;
      keys.add(event.code);
      if (event.code === 'Space' && !event.repeat) fire();
    });
    document.addEventListener('keyup', event => {
      if (!controls.has(event.code)) return;
      event.preventDefault();
      keys.delete(event.code);
    });
    window.addEventListener('blur', () => keys.clear());
    document.addEventListener('visibilitychange', () => {
      keys.clear();
      lastFrame = performance.now();
    });
    document.getElementById('restart').addEventListener('click', restart);

    function update(dt) {
      let dx = Number(keys.has('ArrowRight')) - Number(keys.has('ArrowLeft'));
      let dy = Number(keys.has('ArrowDown')) - Number(keys.has('ArrowUp'));
      if (dx || dy) {
        const length = Math.hypot(dx, dy);
        dx /= length; dy /= length;
        ship.angle = Math.atan2(dy, dx);
        ship.x = wrap(ship.x + dx * 215 * dt, W);
        ship.y = wrap(ship.y + dy * 215 * dt, H);
      }
      fireCooldown = Math.max(0, fireCooldown - dt);
      if (keys.has('Space')) fire();
      for (const rock of asteroids) {
        rock.x = wrap(rock.x + rock.vx * dt, W);
        rock.y = wrap(rock.y + rock.vy * dt, H);
        rock.angle += rock.spin * dt;
      }
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.x = wrap(bullet.x + bullet.vx * dt, W);
        bullet.y = wrap(bullet.y + bullet.vy * dt, H);
        bullet.remaining -= dt;
        if (bullet.remaining <= 0) { bullets.splice(i, 1); continue; }
        const hit = asteroids.findIndex(rock => distance(bullet, rock) < rock.r * .88 + 2);
        if (hit !== -1) { asteroids.splice(hit, 1); bullets.splice(i, 1); }
      }
      if (asteroids.some(rock => distance(ship, rock) < ship.r + rock.r * .88)) endGame();
    }
    function drawRock(rock, x, y) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rock.angle);
      ctx.beginPath();
      rock.outline.forEach((radius, i) => {
        const a = i * Math.PI * 2 / rock.outline.length;
        const px = Math.cos(a) * rock.r * radius, py = Math.sin(a) * rock.r * radius;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath(); ctx.fillStyle = '#15222d'; ctx.fill();
      ctx.strokeStyle = '#8fa5b4'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    }
    function draw() {
      ctx.fillStyle = '#0a111b'; ctx.fillRect(0, 0, W, H);
      for (const rock of asteroids) {
        for (const ox of [-W, 0, W]) for (const oy of [-H, 0, H]) {
          if (rock.x + ox < -rock.r || rock.x + ox > W + rock.r || rock.y + oy < -rock.r || rock.y + oy > H + rock.r) continue;
          drawRock(rock, rock.x + ox, rock.y + oy);
        }
      }
      ctx.fillStyle = '#f6df9c';
      for (const bullet of bullets) { ctx.beginPath(); ctx.arc(bullet.x, bullet.y, 2.7, 0, Math.PI * 2); ctx.fill(); }
      for (const ox of [-W, 0, W]) for (const oy of [-H, 0, H]) {
        if (ship.x + ox < -22 || ship.x + ox > W + 22 || ship.y + oy < -22 || ship.y + oy > H + 22) continue;
        ctx.save(); ctx.translate(ship.x + ox, ship.y + oy); ctx.rotate(ship.angle);
        ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-12, -11); ctx.lineTo(-7, 0); ctx.lineTo(-12, 11); ctx.closePath();
        ctx.fillStyle = gameOver ? '#b1867d' : '#d9f0f0'; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = gameOver ? '#ffc0ac' : '#9ed8de'; ctx.stroke(); ctx.restore();
      }
      if (gameOver) {
        ctx.fillStyle = 'rgba(5, 10, 17, .7)'; ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.fillStyle = '#f5e8e2'; ctx.font = '600 34px system-ui, sans-serif';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 8);
        ctx.font = '16px system-ui, sans-serif'; ctx.fillStyle = '#b4c5cf';
        ctx.fillText('Select Restart to fly again', W / 2, H / 2 + 27);
      }
    }
    function frame(now) {
      const dt = Math.min(Math.max((now - lastFrame) / 1000, 0), .035);
      lastFrame = now;
      if (!gameOver) update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    restart();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
