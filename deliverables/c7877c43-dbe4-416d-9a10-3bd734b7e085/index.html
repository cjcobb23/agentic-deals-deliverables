<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Garden</title>
<style>
 :root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e9efe4;background:#111f1c}
 *{box-sizing:border-box}body{margin:0;padding:26px;min-height:100vh;display:grid;place-items:center}
 main{width:min(100%,960px)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}
 h1{font:600 36px Georgia,serif;letter-spacing:-.7px;margin:0 0 5px}.subtitle{color:#a8c0b1;margin:0;font-size:14px}
 button{font:600 14px system-ui,sans-serif;background:#dbe7b1;color:#183429;border:0;border-radius:7px;padding:11px 17px;cursor:pointer;white-space:nowrap}
 button:hover{background:#eff4d7}button:focus-visible,canvas:focus-visible{outline:3px solid #b7e6dc;outline-offset:4px}
 .brief{border:1px solid #385448;background:#1b3028;border-radius:10px;padding:15px 18px;margin-bottom:15px}
 .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
 h2{font-size:17px;margin:0}.state{font-size:12px;color:#9fe0dd;background:#173a36;border:1px solid #37695e;padding:5px 9px;border-radius:6px}
 #rule{color:#c5d6c2;font-size:14px;line-height:1.55;margin:10px 0 0;max-width:850px}
 canvas{display:block;width:100%;height:auto;background:#203b2e;border:1px solid #4b6a50;border-radius:10px}
 .controls{font-size:14px;color:#d4dfc8;margin:14px 0 8px;line-height:1.6}.legend{display:flex;gap:18px;flex-wrap:wrap;color:#a8bfb0;font-size:12px;margin-bottom:6px}
 .legend span{display:flex;align-items:center;gap:6px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f2d48d}.echo{background:transparent;border:2px solid #80d5d5}.bloom{background:#e9a9c0}.plate{background:#6bbca0;border-radius:2px}
 #completion{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#243e30;border:1px solid #66885b;border-radius:9px;padding:15px 18px;margin-top:15px}
 #completion[hidden]{display:none}#result{margin:0;font:600 21px Georgia,serif}#result-note{font-size:13px;color:#bed0b7;margin:5px 0 0}
</style>
</head>
<body>
<main>
 <header><div><h1>Echo Garden</h1><p class="subtitle">Leave a little of yourself behind.</p></div><button type="button" id="restart">Restart Puzzle</button></header>
 <section class="brief" aria-label="Current puzzle instructions"><div class="row"><h2 id="room-title"></h2><span id="record-state" class="state" role="status" aria-live="polite"></span></div><p id="rule"></p></section>
 <canvas id="garden" width="840" height="480" tabindex="0" aria-label="Garden puzzle. Arrow keys move; Space records an echo. Guide the live gardener to the pink flower."></canvas>
 <p class="controls"><strong>Arrow keys</strong> move &nbsp;·&nbsp; <strong>Space</strong> commits your path and makes or replaces your echo &nbsp;·&nbsp; Reach the <strong>pink flower</strong>.</p>
 <div class="legend" aria-label="Garden legend"><span><i class="dot"></i>You: straw hat</span><span><i class="dot echo"></i>Echo: blue ring</span><span><i class="dot plate"></i>Lettered pressure plate</span><span><i class="dot bloom"></i>Flower goal</span></div>
 <section id="completion" hidden aria-live="polite"><div><p id="result"></p><p id="result-note"></p></div><button type="button" id="next">Next Puzzle</button></section>
</main>
<script>
'use strict';
const canvas=document.getElementById('garden'),ctx=canvas.getContext('2d');
const W=840,H=480,R=11,keys=new Set();
const controls=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);
const rooms=[
 {name:'1 / A place to stay',start:{x:100,y:350},flower:{x:740,y:250},
  rule:'Walk onto plate A, then press Space. Your echo will replay that walk and stay on A, holding the violet gate open. Move independently through the gate to the flower. The gate closes whenever A is empty.',
  walls:[{x:410,y:20,w:24,h:180},{x:410,y:300,w:24,h:160}],
  plates:[{id:'A',x:220,y:130}],gates:[{id:'A',x:410,y:200,w:24,h:100,type:'momentary'}]},
 {name:'2 / Two make a bridge',start:{x:100,y:350},flower:{x:740,y:350},
  rule:'Make an echo that ends on A. While it holds A, walk onto B yourself. When A and B are occupied together, the amber gate latches open. It stays open until Restart Puzzle; then both of you can let go.',
  walls:[{x:530,y:20,w:24,h:280},{x:530,y:400,w:24,h:60},{x:280,y:190,w:110,h:90}],
  plates:[{id:'A',x:170,y:120},{id:'B',x:390,y:350}],gates:[{id:'AB',x:530,y:300,w:24,h:100,type:'latched'}]},
 {name:'3 / The long echo',start:{x:100,y:350},flower:{x:740,y:350},
  rule:'First, step on A: the amber gate latches open. Continue through it to B, then press Space. Your recorded echo will retrace the whole route and hold B, opening the far violet gate. Space keeps latched gates open; Restart Puzzle clears everything.',
  walls:[{x:290,y:20,w:24,h:70},{x:290,y:190,w:24,h:270},{x:570,y:20,w:24,h:280},{x:570,y:410,w:24,h:50}],
  plates:[{id:'A',x:150,y:140},{id:'B',x:420,y:140}],gates:[{id:'A',x:290,y:90,w:24,h:100,type:'latched'},{id:'B',x:570,y:300,w:24,h:110,type:'momentary'}]}
];
let level=0,room,player,ghost,recording,takeStarted,wasMoving,completed,latches,plates,gates,lastFrame=performance.now();
function appendPoint(t,x,y){
 const p={t:Math.max(0,t),x,y},last=recording[recording.length-1];
 if(last&&p.t<=last.t+.000001)recording[recording.length-1]=p;else recording.push(p);
}
function resetRoom(){
 room=rooms[level];player={...room.start};ghost=null;recording=[{t:0,...room.start}];
 keys.clear();completed=false;wasMoving=false;latches={A:false,pair:false};
 takeStarted=performance.now();lastFrame=takeStarted;
 document.getElementById('room-title').textContent=room.name;
 document.getElementById('rule').textContent=room.rule;
 document.getElementById('completion').hidden=true;
 updateGates();updateHint();canvas.focus({preventScroll:true});draw();
}
function commitTake(){
 if(completed)return;
 const now=performance.now();appendPoint((now-takeStarted)/1000,player.x,player.y);
 const path=recording.map(p=>({...p}));
 ghost={path,startedAt:now,duration:path[path.length-1].t,cursor:0,x:path[0].x,y:path[0].y,done:false};
 player={...room.start};keys.clear();recording=[{t:0,...room.start}];wasMoving=false;takeStarted=now;
 updateGates();updateHint();
}
function updateEcho(now){
 if(!ghost)return;
 const elapsed=Math.max(0,(now-ghost.startedAt)/1000),path=ghost.path;
 while(ghost.cursor+1<path.length&&path[ghost.cursor+1].t<=elapsed)ghost.cursor++;
 const a=path[ghost.cursor],b=path[Math.min(ghost.cursor+1,path.length-1)];
 const f=b.t>a.t?Math.min(1,Math.max(0,(elapsed-a.t)/(b.t-a.t))):1;
 ghost.x=a.x+(b.x-a.x)*f;ghost.y=a.y+(b.y-a.y)*f;
 ghost.done=elapsed>=ghost.duration;
}
function onPlate(actor,plate){return actor&&Math.hypot(actor.x-plate.x,actor.y-plate.y)<=22;}
function updateGates(){
 plates=room.plates.map(p=>({...p,occupied:!!(onPlate(player,p)||onPlate(ghost,p))}));
 const occupied=id=>plates.some(p=>p.id===id&&p.occupied);
 if(level===1&&occupied('A')&&occupied('B'))latches.pair=true;
 if(level===2&&occupied('A'))latches.A=true;
 gates=room.gates.map(g=>({...g,open:level===0?occupied('A'):level===1?latches.pair:g.id==='A'?latches.A:occupied('B')}));
}
function touchesRect(x,y,r){
 const nx=Math.max(r.x,Math.min(x,r.x+r.w)),ny=Math.max(r.y,Math.min(y,r.y+r.h));
 return (x-nx)**2+(y-ny)**2<R*R;
}
function blocked(x,y){
 return x<R+20||y<R+20||x>W-20-R||y>H-20-R||room.walls.some(r=>touchesRect(x,y,r))||gates.some(g=>!g.open&&touchesRect(x,y,g));
}
function tick(now,dt){
 if(completed)return;
 updateEcho(now);updateGates();
 const old={...player};let dx=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')),dy=Number(keys.has('ArrowDown'))-Number(keys.has('ArrowUp'));
 if(dx||dy){const n=Math.hypot(dx,dy);dx=dx/n*190*dt;dy=dy/n*190*dt;if(!blocked(player.x+dx,player.y))player.x+=dx;if(!blocked(player.x,player.y+dy))player.y+=dy;}
 const moving=player.x!==old.x||player.y!==old.y,t=(now-takeStarted)/1000;
 if(moving){
  if(!wasMoving)appendPoint(Math.max(0,t-dt),old.x,old.y);
  if(t-recording[recording.length-1].t>=1/30)appendPoint(t,player.x,player.y);
 }else if(wasMoving)appendPoint(t,player.x,player.y);
 wasMoving=moving;updateGates();
 if(Math.hypot(player.x-room.flower.x,player.y-room.flower.y)<24)finishRoom();
 updateHint();
}
function finishRoom(){
 completed=true;keys.clear();
 document.getElementById('completion').hidden=false;
 document.getElementById('result').textContent=level===2?'Garden complete!':'Flower found!';
 document.getElementById('result-note').textContent=level===2?'All three flowers are blooming. You and your echo did it.':'Your echo helped this corner of the garden bloom.';
 document.getElementById('next').textContent=level===2?'Play Again':'Next Puzzle';
}
function updateHint(){
 const value=completed?(level===2?'Garden complete':'Puzzle complete'):!ghost?'Recording your path · Space makes an echo':ghost.done?'Echo holding its final position · Space replaces it':'Echo replaying · You are recording a new take';
 const hint=document.getElementById('record-state');if(hint.textContent!==value)hint.textContent=value;
}
document.addEventListener('keydown',event=>{
 if(!controls.has(event.code))return;event.preventDefault();
 if(event.code==='Space'){if(!event.repeat)commitTake();}else if(!completed)keys.add(event.code);
});
document.addEventListener('keyup',event=>{if(controls.has(event.code)){event.preventDefault();keys.delete(event.code);}});
window.addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>keys.clear());
document.getElementById('restart').addEventListener('click',resetRoom);
document.getElementById('next').addEventListener('click',()=>{if(!completed)return;level=(level+1)%rooms.length;resetRoom();});
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
function drawWall(r){
 roundRect(r.x,r.y,r.w,r.h,5,'#47613d','#6b8557');
 ctx.fillStyle='#5e784c';
 for(let y=r.y+8;y<r.y+r.h-3;y+=18)for(let x=r.x+7;x<r.x+r.w-3;x+=18){ctx.beginPath();ctx.ellipse(x,y,4,2,-.5,0,Math.PI*2);ctx.fill();}
}
function drawGardener(actor,echo=false){
 ctx.save();ctx.translate(actor.x,actor.y);
 if(echo){
  ctx.fillStyle='rgba(108,217,216,.23)';ctx.strokeStyle='#9be5e2';ctx.lineWidth=2;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(7,0);ctx.lineTo(0,7);ctx.lineTo(-7,0);ctx.closePath();ctx.stroke();
 }else{
  ctx.fillStyle='#172e23';ctx.beginPath();ctx.ellipse(0,10,12,4,0,0,Math.PI*2);ctx.fill();
  roundRect(-8,-1,16,15,5,'#d4cf81','#f2dea0');ctx.fillStyle='#edc499';ctx.beginPath();ctx.arc(0,-5,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f2d48d';ctx.beginPath();ctx.ellipse(0,-9,12,4,0,0,Math.PI*2);ctx.fill();roundRect(-7,-16,14,8,3,'#d8b964');
 }
 ctx.restore();
}
function drawFlower(){
 const f=room.flower;ctx.save();ctx.translate(f.x,f.y);
 ctx.strokeStyle='#8ba967';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,2);ctx.quadraticCurveTo(6,17,0,28);ctx.stroke();
 ctx.fillStyle='#8ba967';ctx.beginPath();ctx.ellipse(7,15,8,3,-.5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=completed?'#ffcfdb':'#e9a9c0';for(let i=0;i<7;i++){const a=i*Math.PI*2/7;ctx.beginPath();ctx.ellipse(Math.cos(a)*11,Math.sin(a)*11,9,5,a,0,Math.PI*2);ctx.fill();}
 ctx.fillStyle='#f0d47e';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#203b2e';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(167,190,137,.065)';ctx.lineWidth=1;for(let x=20;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,H-20);ctx.stroke();}for(let y=20;y<H;y+=40){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(W-20,y);ctx.stroke();}
 for(const r of [{x:0,y:0,w:W,h:20},{x:0,y:H-20,w:W,h:20},{x:0,y:20,w:20,h:H-40},{x:W-20,y:20,w:20,h:H-40},...room.walls])drawWall(r);
 if(ghost){ctx.beginPath();ctx.strokeStyle='rgba(114,214,212,.18)';ctx.lineWidth=2;const path=ghost.path;for(let i=0;i<=ghost.cursor;i++){const p=path[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}ctx.lineTo(ghost.x,ghost.y);ctx.stroke();}
 for(const p of plates){
  ctx.lineWidth=2;ctx.fillStyle=p.occupied?'#75bca0':'#304d40';ctx.strokeStyle=p.occupied?'#c5eed9':'#8eb09a';ctx.beginPath();ctx.arc(p.x,p.y,24,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=p.occupied?'#16372a':'#d6e4cc';ctx.font='600 14px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.id,p.x,p.y+5);
 }
 for(const g of gates){
  const color=g.type==='latched'?'#d4b76b':'#b49bdb';ctx.lineWidth=2;
  if(g.open){ctx.setLineDash([4,6]);roundRect(g.x,g.y,g.w,g.h,3,null,color);ctx.setLineDash([]);}else{roundRect(g.x,g.y,g.w,g.h,3,g.type==='latched'?'#725f35':'#63547f',color);ctx.strokeStyle=color;for(let y=g.y+12;y<g.y+g.h-5;y+=15){ctx.beginPath();ctx.moveTo(g.x+3,y);ctx.lineTo(g.x+g.w-3,y);ctx.stroke();}}
  ctx.fillStyle=color;ctx.textAlign='center';ctx.font='600 12px system-ui,sans-serif';ctx.fillText(g.id,g.x+g.w/2,g.y-8);
 }
 drawFlower();if(ghost)drawGardener(ghost,true);drawGardener(player);
 if(completed){roundRect(W/2-125,28,250,46,8,'#173327','#92ae75');ctx.fillStyle='#e2ebc6';ctx.font='600 19px Georgia,serif';ctx.textAlign='center';ctx.fillText(level===2?'Garden complete!':'Flower found!',W/2,58);}
}
function frame(now){const dt=Math.min(.035,Math.max(0,(now-lastFrame)/1000));lastFrame=now;tick(now,dt);draw();requestAnimationFrame(frame);}
resetRoom();requestAnimationFrame(frame);
</script>
</body>
</html>
